name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # WPF + WinRT projections only build on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore tloverlay.sln

      - name: Build
        run: dotnet build tloverlay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/TLOverlay.Core.Tests/TLOverlay.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # Runs the exact command the release uses. Publishing has its own ways to
      # fail that a plain build never hits - single-file packing, the RID-specific
      # restore, SQLite's native library - so it is worth proving on every push
      # rather than discovering it while cutting a tag.
      - name: Publish
        run: >
          dotnet publish src/TLOverlay.App/TLOverlay.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          --output artifacts/TLOverlay-win-x64

      - name: Check the executable was produced
        shell: pwsh
        run: |
          $exe = "artifacts/TLOverlay-win-x64/TLOverlay.exe"
          if (-not (Test-Path $exe)) { throw "TLOverlay.exe was not produced" }

      # Building every window without showing one. This is the check 0.3.0
      # needed and did not have: the panel threw while its XAML was still being
      # parsed, so the app could not open at all, and nothing between the commit
      # and the release noticed. --version cannot catch that - it answers and
      # exits before a window exists.
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/TLOverlay-win-x64/TLOverlay.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "self-test-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "self-test-err.txt"

          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow

          # A window that blocks on a dialog would otherwise hang the job for
          # hours rather than failing it.
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "TLOverlay --self-test did not exit within 120 seconds"
          }

          Get-Content $out, $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "TLOverlay --self-test exited with $($process.ExitCode)"
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "TLOverlay.exe is $mb MB"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: TLOverlay-win-x64
          path: artifacts/TLOverlay-win-x64

  # Separate job: a withdrawn model upstream is worth knowing about, but it must
  # not stop the build and test signal from reporting.
  catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the model URLs still resolve
        shell: pwsh
        run: pwsh tools/check-model-urls.ps1

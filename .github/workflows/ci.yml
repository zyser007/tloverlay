name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # WPF + WinRT projections only build on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore tloverlay.sln

      - name: Build
        run: dotnet build tloverlay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/TLOverlay.Core.Tests/TLOverlay.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # Runs the exact command the release uses. Publishing has its own ways to
      # fail that a plain build never hits - single-file packing, the RID-specific
      # restore, SQLite's native library - so it is worth proving on every push
      # rather than discovering it while cutting a tag.
      - name: Publish
        run: >
          dotnet publish src/TLOverlay.App/TLOverlay.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          --output artifacts/TLOverlay-win-x64

      - name: Check the executable was produced
        shell: pwsh
        run: |
          $exe = "artifacts/TLOverlay-win-x64/TLOverlay.exe"
          if (-not (Test-Path $exe)) { throw "TLOverlay.exe was not produced" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "TLOverlay.exe is $mb MB"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: TLOverlay-win-x64
          path: artifacts/TLOverlay-win-x64

  # Separate job: a withdrawn model upstream is worth knowing about, but it must
  # not stop the build and test signal from reporting.
  catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the model URLs still resolve
        shell: pwsh
        run: pwsh tools/check-model-urls.ps1

name: Release

# Cutting a release is pushing a tag. Nothing else publishes one, so the tag is
# always the source of truth for what shipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ inputs.version }}'
          }
          Write-Host "Building $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/TLOverlay.Core.Tests/TLOverlay.Core.Tests.csproj --configuration Release

      # Self-contained: players should not have to install a .NET runtime before
      # they can read their game. Trimming is deliberately off - WPF does not
      # support it, and enabling it produces a build that crashes at startup.
      - name: Publish
        run: >
          dotnet publish src/TLOverlay.App/TLOverlay.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/TLOverlay-win-x64

      # Between publishing and packaging on purpose: a build that cannot open a
      # window must not reach a release asset. 0.3.0 did, and it left everyone
      # who downloaded it with an error box and no way back.
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/TLOverlay-win-x64/TLOverlay.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "self-test-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "self-test-err.txt"

          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow

          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "TLOverlay --self-test did not exit within 120 seconds"
          }

          Get-Content $out, $err -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "TLOverlay --self-test exited with $($process.ExitCode)"
          }

      - name: Stage the package
        shell: pwsh
        run: |
          # Licence text ships with the binary; models do not - they are several
          # gigabytes and the app fetches them on first run.
          Copy-Item NOTICE.md, README.md artifacts/TLOverlay-win-x64/
          Compress-Archive -Path artifacts/TLOverlay-win-x64/* `
            -DestinationPath "TLOverlay-${{ steps.version.outputs.version }}-win-x64.zip"

          # The bare executable as well as the zip. People download the zip;
          # the in-app updater takes this, so an update is one file and no
          # unpacking step that could half-succeed.
          Copy-Item artifacts/TLOverlay-win-x64/TLOverlay.exe TLOverlay.exe

      # The executable is unsigned, so this file is the only thing that lets the
      # updater tell a real release from whatever else arrives over the wire. It
      # refuses to install anything it cannot match against these hashes.
      - name: Write the checksums
        shell: pwsh
        run: |
          $files = @(
            "TLOverlay.exe",
            "TLOverlay-${{ steps.version.outputs.version }}-win-x64.zip"
          )

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLower()
            "$hash *$(Split-Path -Leaf $file)"
          }

          # ASCII with Unix line endings: what sha256sum -c reads, and what the
          # updater's parser expects.
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'SHA256SUMS.txt'),
            ($lines -join "`n") + "`n",
            [Text.UTF8Encoding]::new($false))

          Get-Content SHA256SUMS.txt

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" `
            "TLOverlay-${{ steps.version.outputs.version }}-win-x64.zip" `
            "TLOverlay.exe" `
            "SHA256SUMS.txt" `
            --title "TLOverlay ${{ steps.version.outputs.version }}" `
            --generate-notes
